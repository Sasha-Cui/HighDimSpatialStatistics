[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "highdimspatial"
version = "0.1.0"
description = "Auditable multivariate spatial Matérn research code"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "torch>=2.1",
]

[project.optional-dependencies]
data = ["anndata>=0.10", "scanpy>=1.10"]
plot = ["matplotlib>=3.8", "seaborn>=0.13"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Keep the intended correctness-only lint contract stable across releases.
select = ["E4", "E7", "E9", "F"]
